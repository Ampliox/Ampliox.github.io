	<script>
		function checkInputType(input){
			const trimmedInput = input.trim();

			const urlPattern = /^(https?:\/\/)?([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(\/[^\s]*)?$/i; //HTTP/s or Domain
			const ipPattern = /^^(?:\d{1,3}\.){3}\d{1,3}$/; //IPv4
			const hashPattern = /^[a-fA-F0-9]{32}$|^[a-fA-F0-9]{40}$|^[a-fA-F0-9]{64}$/; // MD5, SHA-1, SHA-256
			const emailPattern = /^([a-z0-9_\.-]+)@([\da-z\.-]+)\.([a-z\.]{2,6})$/; //Emails
			const phonePattern = /(\+\d{1,3}\s?)?((\(\d{3}\)\s?)|(\d{3})(\s|-?))(\d{3}(\s|-?))(\d{4})(\s?(([E|e]xt[:|.|]?)|x|X)(\s?\d+))?/g;


			if(urlPattern.test(trimmedInput)){
				return 'URL';
			}
			else if (ipPattern.test(trimmedInput)){
				const octet = trimmedInput.split('.').map(Number);
				const isValidIP = octet.every(octet => octet >= 0 && octet <= 255);
				return 'IP';
			} else if (hashPattern.test(trimmedInput)) {
				return 'Hash';
			} else if (emailPattern.test(trimmedInput)){
				return 'Email';
			} else if (phonePattern.test(trimmedInput)) {
				return 'Phone';
			}
			else {
				return 'Error';
			}


		}
